[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newspaper-ner"
version = "0.1.0"
dependencies = [
    "typer==0.28.0",
    "pillow==13.0.0",
    "pytesseract==0.3.13",
    "rich==15.0.0",
    "spacy==3.8.18",
    "en_core_web_lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl#sha256=293e9547a655b25499198ab15a525b05b9407a75f10255e405e8c3854329ab63",
]

[tool.setuptools]
package-dir = {"" = "work"}

[tool.setuptools.packages.find]
where = ["work"]

[project.scripts]
newspaper-ner = "newspaper_ner.cli:app"
newspaper-ner-evaluate = "newspaper_ner.evaluation:app"
newspaper-ner-aggregate = "newspaper_ner.aggregate:app"
newspaper-ner-entities = "newspaper_ner.ner:app"
newspaper-ner-score = "newspaper_ner.ner_evaluation:app"
newspaper-ner-pool-entities = "newspaper_ner.ner_aggregate:app"
newspaper-ner-compare = "newspaper_ner.comparison:app"
newspaper-ner-demo = "newspaper_ner.demo:app"
