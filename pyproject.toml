[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newspaper-ner"
version = "0.1.0"
dependencies = ["typer==0.28.0", "pillow==13.0.0", "pytesseract==0.3.13"]

[tool.setuptools]
package-dir = {"" = "work"}

[tool.setuptools.packages.find]
where = ["work"]

[project.scripts]
newspaper-ner = "newspaper_ner.cli:app"
