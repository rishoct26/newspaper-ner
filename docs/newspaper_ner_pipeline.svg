<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">Newspaper OCR and named entity recognition pipeline</title>
  <desc id="desc">A scanned page and saved layout JSON feed layout detection. Layout regions feed Tesseract OCR, whose word text, confidence, and page boxes feed spaCy NER. NER entities and boxes feed an overlay image. JSON files and images are saved under outputs.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34495e"/></marker>
    <style>
      .box { rx: 18; stroke-width: 3; }
      .title { font: 700 22px Arial, sans-serif; fill: #14212b; }
      .body { font: 16px Arial, sans-serif; fill: #243746; }
      .arrow { stroke: #34495e; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .note { font: 15px Arial, sans-serif; fill: #34495e; }
    </style>
  </defs>
  <rect width="1200" height="590" fill="#f7f9fb"/>
  <text x="600" y="42" text-anchor="middle" class="title" font-size="28">Newspaper OCR + NER demo (English)</text>

  <rect x="35" y="105" width="215" height="130" class="box" fill="#e8f1fb" stroke="#3973ac"/>
  <text x="142" y="140" text-anchor="middle" class="title">Input</text>
  <text x="142" y="171" text-anchor="middle" class="body">Scanned newspaper page</text>
  <text x="142" y="197" text-anchor="middle" class="body">PNG / JP2-converted PNG</text>

  <rect x="320" y="85" width="245" height="170" class="box" fill="#eee9fa" stroke="#7355a5"/>
  <text x="442" y="122" text-anchor="middle" class="title">Layout detection</text>
  <text x="442" y="153" text-anchor="middle" class="body">PaddleOCR</text>
  <text x="442" y="178" text-anchor="middle" class="body">PP-DocLayout_plus-L</text>
  <text x="442" y="207" text-anchor="middle" class="body">Separate venv; CPU;</text>
  <text x="442" y="230" text-anchor="middle" class="body">MKLDNN off</text>

  <rect x="640" y="85" width="245" height="170" class="box" fill="#e6f5eb" stroke="#368653"/>
  <text x="762" y="122" text-anchor="middle" class="title">Region OCR</text>
  <text x="762" y="153" text-anchor="middle" class="body">Tesseract 5.4 / eng</text>
  <text x="762" y="183" text-anchor="middle" class="body">Word text + confidence</text>
  <text x="762" y="210" text-anchor="middle" class="body">Page-pixel boxes</text>

  <rect x="960" y="85" width="205" height="170" class="box" fill="#fff2dc" stroke="#d08a20"/>
  <text x="1062" y="122" text-anchor="middle" class="title">NER</text>
  <text x="1062" y="153" text-anchor="middle" class="body">spaCy</text>
  <text x="1062" y="180" text-anchor="middle" class="body">en_core_web_lg</text>
  <text x="1062" y="210" text-anchor="middle" class="body">PER / ORG / LOC / DATE</text>

  <rect x="640" y="365" width="245" height="145" class="box" fill="#fde8e8" stroke="#b74444"/>
  <text x="762" y="405" text-anchor="middle" class="title">Entity overlay</text>
  <text x="762" y="438" text-anchor="middle" class="body">Colored entity boxes</text>
  <text x="762" y="466" text-anchor="middle" class="body">mapped to the page</text>
  <text x="762" y="491" text-anchor="middle" class="body">PNG demo image</text>

  <rect x="320" y="365" width="245" height="145" class="box" fill="#edf1f4" stroke="#647887"/>
  <text x="442" y="405" text-anchor="middle" class="title">Layout regions</text>
  <text x="442" y="438" text-anchor="middle" class="body">Bounding boxes + labels</text>
  <text x="442" y="466" text-anchor="middle" class="body">Saved layout JSON</text>

  <path d="M250 170 H310" class="arrow"/>
  <path d="M565 170 H630" class="arrow"/>
  <path d="M885 170 H950" class="arrow"/>
  <path d="M442 255 V355" class="arrow"/>
  <path d="M565 438 H630" class="arrow"/>
  <path d="M885 438 C940 438 940 270 1062 265" class="arrow"/>
  <path d="M1062 255 V310 H762 V355" class="arrow"/>
  <text x="600" y="555" text-anchor="middle" class="note">Saved/reused inputs: layout JSON  |  Outputs: OCR JSON, NER JSON, page overlay PNG</text>
</svg>
